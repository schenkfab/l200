name: Blog Writer ADK CI/CD & Evaluation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit, Guardrail, Schema & HITL Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run ADK Automated Evaluation Suite (when credentials available)
        if: ${{ env.GOOGLE_API_KEY != '' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          adk eval blog_writer eval/blog_writer.evalset.json --config_file_path=eval/test_config.json

  terraform-validate:
    runs-on: ubuntu-latest
    needs: test-and-evaluate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format & Init Check
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
